name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage package
        run: |
          mkdir -p dist
          cp manifest.json icon-256.png dist/
          cp -r Server dist/Server

      - name: Read version from manifest
        id: manifest
        run: echo "version=$(jq -r '.Version' manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create zip
        run: |
          zip -r "VegetalHide_${{ steps.manifest.outputs.version }}.zip" .
        working-directory: dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VegetalHide_${{ steps.manifest.outputs.version }}.zip
          generate_release_notes: true
