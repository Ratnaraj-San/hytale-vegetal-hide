name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage package
        run: |
          mkdir -p dist
          cp manifest.json icon-256.png dist/
          cp -r Server dist/Server

      - name: Create zip
        run: |
          zip -r "VegetalHide_${GITHUB_REF_NAME}.zip" .
        working-directory: dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VegetalHide_${{ github.ref_name }}.zip
          generate_release_notes: true
